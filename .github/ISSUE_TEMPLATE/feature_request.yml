name: Feature request
description: 建议新的规则、模板或文档改进
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        说明要解决的问题，而不是只给方案。规则改动需要说明对现有流程的影响。

  - type: textarea
    id: problem
    attributes:
      label: 问题背景
      description: 当前规则或文档哪里不足？谁受影响？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述期望的规则或文档变化。
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      multiple: true
      options:
        - AGENTS.md
        - docs/agent/
        - REVIEW.md
        - .github/
        - 其他
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 考虑过哪些替代做法，为什么不采用？（可选）
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 附加信息
    validations:
      required: false
